[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseas"
version = "0.1.0"
description = "Core PPG processing and aortic stenosis research analyses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PulseAS authors"}]
dependencies = ["numpy>=1.26,<2", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "statsmodels>=0.14", "PyYAML>=6", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.0", "xgboost>=2.1"]
signals = ["pyPPG==1.0.73", "neurokit2==0.2.10", "dotmap==1.3.30", "wfdb>=4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: optional study GPU checks"]
